document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    let bin = '';

      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));

    return btoa(bin);

    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        }

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\u002Fspan><\u002Fdiv>\n    <div class=\"search\">\n      <svg width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" fill=\"none\" style=\"stroke:var(--muted)\" stroke-width=\"1.6\"><circle cx=\"6\" cy=\"6\" r=\"4.5\"><\u002Fcircle><path d=\"M9.5 9.5L13 13\"><\u002Fpath><\u002Fsvg>\n      <input id=\"q\" placeholder=\"Search sites or cities\" autocomplete=\"off\">\n      <div class=\"results\" id=\"results\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"hdr-right\">\n      <div class=\"theme\" id=\"theme\"><button data-t=\"light\">Light<\u002Fbutton><button data-t=\"dark\">Dark<\u002Fbutton><\u002Fdiv>\n      <span class=\"tag\">Sample data · not for underwriting<\u002Fspan>\n      <div class=\"avatar\">JR<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n  <main>\n    <div class=\"map\" id=\"map\">\n      <div class=\"loading\" id=\"loading\">Loading geography…<\u002Fdiv>\n      <svg id=\"svg\"><\u002Fsvg>\n      <div class=\"float layers\" id=\"layers\"><\u002Fdiv>\n      <div class=\"float horizon\"><label>Horizon<\u002Flabel><div class=\"seg\" id=\"horizon\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"float legend\">\n        <h4 id=\"lg-title\">Composite risk score <span>0–100<\u002Fspan><\u002Fh4>\n        <div class=\"lg-row\" id=\"lg\"><\u002Fdiv>\n        <div class=\"lg-note\"><svg width=\"22\" height=\"10\"><circle cx=\"3\" cy=\"5\" r=\"1.6\" fill=\"#9A9DA3\"><\u002Fcircle><circle cx=\"10\" cy=\"5\" r=\"2.6\" fill=\"#9A9DA3\"><\u002Fcircle><circle cx=\"18\" cy=\"5\" r=\"3.8\" fill=\"#9A9DA3\"><\u002Fcircle><\u002Fsvg>Cell size also scales with intensity · ~40 km grid<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"float zoom\"><button id=\"zin\" title=\"Zoom in\">+<\u002Fbutton><button id=\"zout\" title=\"Zoom out\">−<\u002Fbutton><button id=\"zreset\" title=\"Reset view\" style=\"font-size:13px\">⤢<\u002Fbutton><\u002Fdiv>\n      <div class=\"tip\" id=\"tip\"><\u002Fdiv>\n    <\u002Fdiv>\n    <aside>\n      <div class=\"report\" id=\"report\"><\u002Fdiv>\n      <div class=\"chat\" id=\"chat\">\n        <div class=\"chat-head\"><b>Ask about this data<\u002Fb><button id=\"chatToggle\" style=\"display:none\">Collapse<\u002Fbutton><\u002Fdiv>\n        <div class=\"thread\" id=\"thread\"><\u002Fdiv>\n        <div class=\"sugg\" id=\"sugg\"><\u002Fdiv>\n        <form class=\"ask\" id=\"askForm\"><input id=\"askIn\" placeholder=\"e.g. What drives the flood score here?\" autocomplete=\"off\"><button id=\"askBtn\" type=\"submit\" disabled=\"\">Ask<\u002Fbutton><\u002Fform>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fmain>\n<\u002Fdiv>\n<script>\nconst LBL=['Very low','Low','Moderate','High','Severe'];\nconst PAL={light:[['#F2D788','#16181B'],['#F2A057','#16181B'],['#DA5A4A','#fff'],['#9E2F69','#fff'],['#471C5C','#fff']],\n dark:[['#4A2A66','#fff'],['#8A2F72','#fff'],['#C9435E','#fff'],['#EE7A4C','#16181B'],['#F8D27C','#16181B']]};\nlet BINS;const setBins=t=>BINS=PAL[t].map(([c,fg],i)=>({min:i*20,label:LBL[i],c,fg}));\nlet THEME=localStorage.getItem('horizon-theme')||'light';setBins(THEME);document.documentElement.dataset.theme=THEME;\nconst binOf=s=>BINS[Math.min(4,Math.floor(s/20))];\nconst HZ=[{k:'composite',n:'Composite'},{k:'flood',n:'Flood',g:.18,base:6},{k:'erosion',n:'Water erosion',g:.24,base:3},{k:'severe',n:'Severe weather',g:.10,base:8},{k:'wind',n:'Wind',g:.13,base:8}];\nconst HAZ=Object.fromEntries(HZ.map(h=>[h.k,h]));\nconst SPOTS={\n flood:[[-80.2,25.8,72,1.1],[-81.8,26.6,55,1.1],[-95.3,29.7,66,1.4],[-90.1,29.9,82,1.5],[-91,33,48,2.4],[-79.9,32.8,58,.9],[-74.1,40.6,46,1.1],[-121.5,38.4,52,1.2],[-94.5,39.5,28,3],[-75.8,35.6,50,.9],[-76.3,36.9,50,.9],[-122.3,47.5,22,1.2],[-157.9,21.3,30,1]],\n erosion:[[-90.4,29.3,88,1.3],[-75.6,35.5,76,.9],[-121.9,36.6,54,1],[-86.5,43,44,1.3],[-94.8,29.3,62,1],[-70.1,41.7,52,.8],[-80.1,25.9,46,.7],[-156,70.5,82,3],[-124,45,40,1.2],[-82.8,27.8,40,.9]],\n severe:[[-97.5,35.5,80,2.8],[-98,38.5,70,2.8],[-99,41,54,2.4],[-88.5,33,70,2.4],[-97,32.9,60,2.4],[-104.9,39.7,56,1.4],[-93,42,44,2.4],[-86,36,42,2]],\n wind:[[-80.4,25.8,90,1.7],[-90,29.8,76,2.4],[-95.5,28.8,70,2],[-78,34,60,1.8],[-97.5,36,44,4],[-72,41,34,1.8],[-157.8,21.3,50,2],[-106,42,30,2],[-82.5,27.8,62,1.5]]};\nfunction noise(lon,lat,s){return Math.sin(lon*1.7+s)*Math.cos(lat*2.3+s*1.3)*.5+Math.sin(lon*.6-lat*.9+s*2)*.5}\nfunction raw(lon,lat){const o={};let si=0;for(const k of ['flood','erosion','severe','wind']){let v=HAZ[k].base+noise(lon,lat,++si*1.9)*7;const cl=Math.cos(lat*Math.PI/180);for(const [x,y,a,sg] of SPOTS[k]){const dx=(lon-x)*cl,dy=lat-y;v+=a*Math.exp(-(dx*dx+dy*dy)/(2*sg*sg))}o[k]=Math.max(0,v)}return o}\nfunction at(r,t){const o={};let mx=0,sum=0;for(const k of ['flood','erosion','severe','wind']){o[k]=Math.min(100,Math.round(r[k]*(1+HAZ[k].g*t)));mx=Math.max(mx,o[k]);sum+=o[k]}o.composite=Math.min(100,Math.round(.6*mx+.4*sum/4));return o}\nconst SITES=[\n {id:'mia',n:'Brickell office tower',c:'Miami, FL',use:'Proposed · 48-story office',ll:[-80.193,25.761]},\n {id:'hou',n:'Port of Houston logistics hub',c:'Houston, TX',use:'Planned · 1.2M sq ft warehouse',ll:[-95.27,29.73]},\n {id:'nola',n:'Warehouse District mixed-use',c:'New Orleans, LA',use:'Planned · 22-story residential',ll:[-90.07,29.94]},\n {id:'chs',n:'Charleston peninsula campus',c:'Charleston, SC',use:'Under review · Corporate HQ',ll:[-79.93,32.78]},\n {id:'okc',n:'Oklahoma City data center',c:'Oklahoma City, OK',use:'Planned · 60 MW facility',ll:[-97.52,35.47]},\n {id:'den',n:'Denver Tech Center campus',c:'Denver, CO',use:'Proposed · Office campus',ll:[-104.9,39.6]},\n {id:'chi',n:'Chicago Loop headquarters',c:'Chicago, IL',use:'Existing · 34-story office',ll:[-87.63,41.88]},\n {id:'phx',n:'Phoenix distribution center',c:'Phoenix, AZ',use:'Planned · Distribution',ll:[-112.07,33.45]},\n {id:'sac',n:'Sacramento R&D facility',c:'Sacramento, CA',use:'Proposed · Lab & office',ll:[-121.49,38.58]},\n {id:'nyc',n:'Hudson riverfront tower',c:'New York, NY',use:'Proposed · 60-story office',ll:[-74.0,40.75]},\n {id:'sea',n:'South Lake Union offices',c:'Seattle, WA',use:'Existing · Office',ll:[-122.34,47.62]}];\nconst HOR=[2026,2031,2036];\nconst S={layer:'composite',hor:2036,site:SITES[0],msgs:[],busy:false};\nconst tOf=y=>(y-2026)/10;\n\n// ---------- map ----------\nconst mapEl=document.getElementById('map'),svg=d3.select('#svg'),tip=document.getElementById('tip');\nlet W,H,proj,path,cells=[],gRoot,gHex,gMark,zoom,curK=1;\nconst R=6.2,HEXU=d3.range(6).map(i=>{const a=Math.PI/180*(60*i+30);return [Math.cos(a),Math.sin(a)]});\nconst hexD=(x,y,r)=>'M'+HEXU.map(([a,b])=>(x+a*r).toFixed(1)+','+(y+b*r).toFixed(1)).join('L')+'Z';\n\nasync function loadGeo(){\n  try{const t=await (await fetch((window.__resources&&window.__resources.usStates)||'https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-10m.json')).json();\n    return {nation:topojson.feature(t,t.objects.nation),states:topojson.mesh(t,t.objects.states,(a,b)=>a!==b)}}\n  catch(e){const t=await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')).json();\n    const us=topojson.feature(t,t.objects.countries).features.find(f=>f.id==='840');return {nation:us,states:null}}\n}\nasync function initMap(){\n  const geo=await loadGeo();\n  document.getElementById('loading').remove();\n  W=mapEl.clientWidth;H=mapEl.clientHeight;\n  svg.attr('viewBox',`0 0 ${W} ${H}`);\n  proj=d3.geoAlbersUsa().fitExtent([[40,76],[W-40,H-132]],geo.nation);\n  path=d3.geoPath(proj);\n  // mask\n  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');\n  ctx.beginPath();d3.geoPath(proj,ctx)(geo.nation);ctx.fill();\n  const px=ctx.getImageData(0,0,W,H).data;\n  const dx=Math.sqrt(3)*R,dy=1.5*R;let row=0;\n  for(let y=R;y<H;y+=dy,row++)for(let x=(row%2?dx/2:0)+R;x<W;x+=dx){\n    const xi=x|0,yi=y|0;if(!px[(yi*W+xi)*4+3])continue;\n    const ll=proj.invert([x,y]);if(!ll)continue;cells.push({x,y,ll,r:raw(ll[0],ll[1])})}\n  gRoot=svg.append('g');\n  gRoot.append('path').datum(geo.nation).attr('d',path).attr('class','land');\n  gHex=gRoot.append('g');\n  if(geo.states)gRoot.append('path').datum(geo.states).attr('d',path).attr('fill','none').attr('class','stl').attr('stroke-width',.9).attr('stroke-opacity',.9).attr('vector-effect','non-scaling-stroke').style('pointer-events','none');\n  gRoot.append('path').datum(geo.nation).attr('d',path).attr('fill','none').attr('class','nat').attr('stroke-width',.8).attr('vector-effect','non-scaling-stroke').style('pointer-events','none');\n  gMark=gRoot.append('g');\n  gHex.selectAll('path').data(cells).join('path');\n  gHex.on('mousemove',e=>{const d=e.target.__data__;if(!d)return;const s=at(d.r,tOf(S.hor))[S.layer],b=binOf(s);\n      const r=mapEl.getBoundingClientRect();\n      tip.innerHTML=`<div><b>${HAZ[S.layer].n}<\u002Fb> · <span class=\"mono\">${s}<\u002Fspan> ${b.label}<\u002Fdiv><div class=\"c mono\">${fmtLL(d.ll)} · ${S.hor}<\u002Fdiv>`;\n      tip.style.display='block';let tx=e.clientX-r.left+14,ty=e.clientY-r.top+14;if(tx>W-220)tx-=240;tip.style.left=tx+'px';tip.style.top=ty+'px'})\n    .on('mouseleave',()=>tip.style.display='none');\n  svg.on('click',e=>{if(e.defaultPrevented)return;const [mx,my]=d3.pointer(e,gRoot.node());\n    const ll=proj.invert([mx,my]);if(!ll)return;const xi=mx|0,yi=my|0;if(xi<0||yi<0||xi>=W||yi>=H||!px[(yi*W+xi)*4+3])return;\n    selectSite({id:'pin',n:'Dropped pin',c:fmtLL(ll),use:'Custom location',ll},false)});\n  zoom=d3.zoom().scaleExtent([1,10]).translateExtent([[0,0],[W,H]]).on('zoom',e=>{gRoot.attr('transform',e.transform);curK=e.transform.k;drawMarks()});\n  svg.call(zoom);\n  document.getElementById('zin').onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,1.6);\n  document.getElementById('zout').onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,1/1.6);\n  document.getElementById('zreset').onclick=()=>svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity);\n  drawHex();drawMarks();\n}\nfunction drawHex(){const t=tOf(S.hor);\n  gHex.selectAll('path').each(function(d){const s=at(d.r,t)[S.layer];this.setAttribute('d',hexD(d.x,d.y,R*(.28+.72*s/100)));this.setAttribute('fill',binOf(s).c)})}\nfunction drawMarks(){if(!gMark)return;const k=1/curK;\n  const list=SITES.slice();if(S.site.id==='pin')list.push(S.site);\n  const g=gMark.selectAll('g.m').data(list,d=>d.id).join(en=>{const g=en.append('g').attr('class','m').style('cursor','pointer');\n      g.append('circle').attr('class','ring');g.append('circle').attr('class','dot');g.append('text').attr('class','site-lbl').attr('x',9).attr('y',4);return g});\n  g.attr('transform',d=>{const p=proj(d.ll)||[-99,-99];return `translate(${p[0]},${p[1]}) scale(${k})`})\n   .on('click',(e,d)=>{e.stopPropagation();selectSite(d,false)});\n  g.select('.ring').attr('r',d=>d.id===S.site.id?10:0).attr('fill','none').style('stroke','var(--ink)').attr('stroke-width',1.5);\n  g.select('.dot').attr('r',d=>d.id===S.site.id?4.5:3.5).style('fill',d=>d.id===S.site.id?'var(--ink)':'var(--panel)').style('stroke','var(--ink)').attr('stroke-width',1.5);\n  g.select('text').text(d=>d.id===S.site.id||curK>2.2?(d.id==='pin'?'Dropped pin':d.c.split(',')[0]):'').attr('x',d=>d.id===S.site.id?14:9);\n  g.filter(d=>d.id===S.site.id).raise();\n}\nfunction flyTo(ll){const p=proj(ll);if(!p)return;const k=2.6;svg.transition().duration(700).call(zoom.transform,d3.zoomIdentity.translate(W/2-k*p[0],H/2-k*p[1]).scale(k))}\nconst fmtLL=ll=>`${Math.abs(ll[1]).toFixed(2)}°${ll[1]>=0?'N':'S'}, ${Math.abs(ll[0]).toFixed(2)}°${ll[0]>=0?'E':'W'}`;\n\n// ---------- controls ----------\nfunction renderControls(){\n  document.getElementById('layers').innerHTML=HZ.map(h=>`<button class=\"${h.k===S.layer?'on':''}\" data-k=\"${h.k}\">${h.n}<\u002Fbutton>`).join('');\n  document.getElementById('horizon').innerHTML=HOR.map(y=>`<button class=\"${y===S.hor?'on':''}\" data-y=\"${y}\">${y}<\u002Fbutton>`).join('');\n  document.getElementById('lg-title').innerHTML=`${HAZ[S.layer].n} risk score <span>${S.hor} · 0–100<\u002Fspan>`;\n}\ndocument.getElementById('layers').onclick=e=>{const k=e.target.dataset.k;if(k)setLayer(k)};\ndocument.getElementById('horizon').onclick=e=>{const y=+e.target.dataset.y;if(y){S.hor=y;renderControls();drawHex();renderReport()}};\nconst renderLegend=()=>document.getElementById('lg').innerHTML=BINS.map((b,i)=>`<div><b style=\"background:${b.c}\"><\u002Fb><span class=\"n mono\">${b.min}–${i===4?100:b.min+19}<\u002Fspan><span class=\"l\">${b.label}<\u002Fspan><\u002Fdiv>`).join('');\nrenderLegend();\nconst thEl=document.getElementById('theme');\nfunction applyTheme(t){THEME=t;localStorage.setItem('horizon-theme',t);document.documentElement.dataset.theme=t;setBins(t);\n  thEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));renderLegend();renderReport();if(gHex){drawHex();drawMarks()}}\nthEl.onclick=e=>{const t=e.target.dataset.t;if(t&&t!==THEME)applyTheme(t)};\nthEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===THEME));\nfunction setLayer(k){S.layer=k;renderControls();drawHex();renderReport()}\n\n// search\nconst qIn=document.getElementById('q'),resEl=document.getElementById('results');let act=0,hits=[];\nfunction renderResults(){const q=qIn.value.trim().toLowerCase();hits=SITES.filter(s=>!q||(s.n+' '+s.c).toLowerCase().includes(q));act=Math.min(act,Math.max(0,hits.length-1));\n  resEl.innerHTML=hits.length?hits.map((s,i)=>{const sc=at(raw(...s.ll),tOf(S.hor)).composite;return `<button class=\"${i===act?'act':''}\" data-id=\"${s.id}\"><span>${s.n}<br><small>${s.c}<\u002Fsmall><\u002Fspan><span class=\"chip\"><b style=\"background:${binOf(sc).c}\"><\u002Fb><span class=\"mono\">${sc}<\u002Fspan><\u002Fspan><\u002Fbutton>`}).join(''):'<div style=\"padding:10px;color:var(--muted)\">No matching sites<\u002Fdiv>';\n  resEl.classList.add('open')}\nqIn.onfocus=renderResults;qIn.oninput=()=>{act=0;renderResults()};\nqIn.onkeydown=e=>{if(e.key==='ArrowDown'){act=Math.min(hits.length-1,act+1);renderResults();e.preventDefault()}else if(e.key==='ArrowUp'){act=Math.max(0,act-1);renderResults();e.preventDefault()}else if(e.key==='Enter'&&hits[act]){pick(hits[act])}else if(e.key==='Escape'){resEl.classList.remove('open');qIn.blur()}};\nresEl.onmousedown=e=>{const b=e.target.closest('button');if(b)pick(SITES.find(s=>s.id===b.dataset.id))};\nqIn.onblur=()=>setTimeout(()=>resEl.classList.remove('open'),120);\nfunction pick(s){qIn.value='';resEl.classList.remove('open');qIn.blur();selectSite(s,true)}\nfunction selectSite(s,fly){S.site=s;drawMarks();renderReport();if(fly)flyTo(s.ll)}\n\n// ---------- report ----------\nfunction risksFor(sc){const L=[];const add=(h,t,d,s)=>L.push({h,t,d,s});\n  const f=sc.flood,e=sc.erosion,v=sc.severe,w=sc.wind;\n  if(f>=30)add('Flood','Storm-surge & riverine inundation',`~${(f/11).toFixed(1)} ft depth at a 1-in-100-year event`,f);\n  if(f>=50)add('Flood','Extreme rainfall flooding',`${Math.round(f/8)} days/yr above 2 in. rainfall`,Math.round(f*.85));\n  if(e>=30)add('Water erosion','Shoreline and bank retreat',`${(e/22).toFixed(1)} ft/yr projected retreat`,e);\n  if(e>=60)add('Water erosion','Foundation undermining','Scour protection advised for shallow foundations',Math.round(e*.8));\n  if(v>=30)add('Severe weather','Large hail (≥1 in.)',`${Math.max(1,Math.round(v/9))} days/yr within 25 mi`,v);\n  if(v>=55)add('Severe weather','Tornado EF2+',`1-in-${Math.round(5200/v)} yr probability of site strike`,Math.round(v*.9));\n  if(w>=30)add('Wind','Hurricane-force gusts',`Design gust ${Math.round(95+w*.85)} mph (3-sec)`,w);\n  if(w>=65)add('Wind','Wind-borne debris region','Impact-rated glazing and cladding expected',Math.round(w*.85));\n  return L.sort((a,b)=>b.s-a.s).slice(0,6)}\nfunction trendSVG(r){const pts=d3.range(11).map(i=>at(r,i/10).composite);const w=338,h=54,x=i=>6+i*(w-12)/10,lo=Math.max(0,Math.min(...pts)-8),hi=Math.min(100,Math.max(...pts)+8),y=v=>h-6-(v-lo)/(hi-lo||1)*(h-18);\n  const sel=HOR.indexOf(S.hor)*5;\n  return `<svg width=\"100%\" viewBox=\"0 0 ${w} ${h+14}\" class=\"trend\"><polyline fill=\"none\" style=\"stroke:var(--ink)\" stroke-width=\"1.6\" points=\"${pts.map((v,i)=>x(i)+','+y(v)).join(' ')}\"/>${[0,5,10].map(i=>`<circle cx=\"${x(i)}\" cy=\"${y(pts[i])}\" r=\"${i===sel?4:2.5}\" style=\"fill:${i===sel?binOf(pts[i]).c:'var(--panel)'};stroke:var(--ink)\" stroke-width=\"1.4\"/><text x=\"${x(i)}\" y=\"${h+12}\" font-size=\"10\" style=\"fill:var(--muted)\" text-anchor=\"${i===0?'start':i===10?'end':'middle'}\" font-family=\"JetBrains Mono\">${2026+i}<\u002Ftext>`).join('')}<\u002Fsvg>`}\nfunction renderReport(){const s=S.site,r=raw(...s.ll),sc=at(r,tOf(S.hor)),now=at(r,0),b=binOf(sc.composite),dl=sc.composite-now.composite;\n  const risks=risksFor(sc);\n  document.getElementById('report').innerHTML=`\n  <div class=\"eyebrow\">Selected site<\u002Fdiv>\n  <div class=\"site-name\">${s.n}<\u002Fdiv>\n  <div class=\"site-meta\"><span>${s.c}<\u002Fspan><span>·<\u002Fspan><span>${s.use}<\u002Fspan><\u002Fdiv>\n  <div class=\"site-meta mono\" style=\"margin-top:4px;font-size:11px\">${fmtLL(s.ll)}<\u002Fdiv>\n  <div class=\"score-card\">\n    <div class=\"eyebrow\">Overall climate risk · ${S.hor}<\u002Fdiv>\n    <div class=\"score-top\" style=\"margin-top:10px\"><div class=\"big\">${sc.composite}<small>/100<\u002Fsmall><\u002Fdiv><span class=\"chip\"><b style=\"background:${b.c}\"><\u002Fb>${b.label}<\u002Fspan><\u002Fdiv>\n    <div class=\"score-sub\"><span>${S.hor===2026?'Current conditions':`Change since 2026: <span class=\"delta mono\">${dl>=0?'+':''}${dl}<\u002Fspan>`}<\u002Fspan><span>10-year outlook<\u002Fspan><\u002Fdiv>\n    ${trendSVG(r)}\n  <\u002Fdiv>\n  <div class=\"sec\"><h3>Hazard breakdown <span>Tick = 2026 baseline<\u002Fspan><\u002Fh3>\n    ${['flood','erosion','severe','wind'].map(k=>{const v=sc[k],bb=binOf(v);return `<button class=\"hz ${S.layer===k?'on':''}\" data-k=\"${k}\"><span class=\"nm\">${HAZ[k].n}<\u002Fspan><span class=\"bar\"><i style=\"width:${v}%;background:${bb.c}\"><\u002Fi><s style=\"left:calc(${now[k]}% - 1px)\"><\u002Fs><\u002Fspan><span class=\"v mono\">${v}<\u002Fspan><span class=\"lb\">${bb.label}<\u002Fspan><\u002Fbutton>`}).join('')}\n  <\u002Fdiv>\n  <div class=\"sec\"><h3>Specific risks <span>${risks.length} identified<\u002Fspan><\u002Fh3>\n    ${risks.length?risks.map(x=>{const bb=binOf(x.s);return `<div class=\"risk\"><div class=\"rs mono\" style=\"background:${bb.c};color:${bb.fg}\">${x.s}<\u002Fdiv><div><div class=\"h\">${x.h}<\u002Fdiv><div class=\"t\">${x.t}<\u002Fdiv><div class=\"d\">${x.d}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`}).join(''):'<div style=\"color:var(--muted)\">No hazards above the low band at this horizon.<\u002Fdiv>'}\n  <\u002Fdiv>\n  <div class=\"src\">Scores combine historical loss, hazard models and property records into a single 0–100 index per ~40 km cell. Projections use a moderate-emissions scenario. Sample data for demonstration.<\u002Fdiv>`;\n  document.querySelectorAll('.hz').forEach(el=>el.onclick=()=>setLayer(el.dataset.k));\n  renderSugg();\n}\n\n// ---------- chat ----------\nconst chatEl=document.getElementById('chat'),thread=document.getElementById('thread'),askIn=document.getElementById('askIn'),askBtn=document.getElementById('askBtn'),tg=document.getElementById('chatToggle');\nfunction renderSugg(){const city=S.site.c.split(',')[0],alt=S.site.id==='hou'?'Miami':'Houston';\n  const q=[`What drives the score for ${S.site.id==='pin'?'this location':city}?`,`How does it compare to ${alt}?`,'What changes by 2036?'];\n  document.getElementById('sugg').innerHTML=q.map(t=>`<button type=\"button\">${t}<\u002Fbutton>`).join('')}\ndocument.getElementById('sugg').onclick=e=>{if(e.target.tagName==='BUTTON')ask(e.target.textContent)};\naskIn.oninput=()=>askBtn.disabled=!askIn.value.trim()||S.busy;\ndocument.getElementById('askForm').onsubmit=e=>{e.preventDefault();if(askIn.value.trim())ask(askIn.value.trim())};\ntg.onclick=()=>{chatEl.classList.toggle('open');tg.textContent=chatEl.classList.contains('open')?'Collapse':'Show thread'};\nfunction renderThread(){thread.innerHTML=S.msgs.map(m=>m.role==='u'?`<div class=\"msg u\">${esc(m.t)}<\u002Fdiv>`:`<div class=\"msg a\"><div class=\"who\">Horizon assistant<\u002Fdiv>${m.t===null?'<span class=\"dots\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fspan>':esc(m.t)}<\u002Fdiv>`).join('');thread.scrollTop=1e6}\nconst esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));\nfunction ctx(site){const r=raw(...site.ll);return {site:site.n+', '+site.c,now:at(r,0),y2031:at(r,.5),y2036:at(r,1),risks:risksFor(at(r,tOf(S.hor))).map(x=>x.t+' ('+x.d+')')}}\nasync function ask(q){if(S.busy)return;S.busy=true;askIn.value='';askBtn.disabled=true;\n  chatEl.classList.add('open');tg.style.display='';tg.textContent='Collapse';\n  S.msgs.push({role:'u',t:q},{role:'a',t:null});renderThread();\n  let ans=null;const c=ctx(S.site);\n  const other=SITES.find(s=>q.toLowerCase().includes(s.c.split(',')[0].toLowerCase())&&s.id!==S.site.id);\n  try{if(window.claude&&window.claude.complete){\n    ans=await window.claude.complete(`You are the help assistant inside a climate risk site-selection tool used by real estate developers. Scores are 0-100 (0-19 very low, 20-39 low, 40-59 moderate, 60-79 high, 80-100 severe) for flood, water erosion, severe weather, wind and a composite. Answer in 2-4 plain sentences using only the data below. Cite scores as numbers. No markdown.\nSelected site data: ${JSON.stringify(c)}\n${other?'Comparison site data: '+JSON.stringify(ctx(other)):''}\nCurrently viewing horizon: ${S.hor}, layer: ${HAZ[S.layer].n}.\nQuestion: ${q}`)}}catch(e){}\n  if(!ans)ans=canned(q,c,other?ctx(other):null);\n  await new Promise(r=>setTimeout(r,ans?300:0));\n  S.msgs[S.msgs.length-1].t=ans.trim();S.busy=false;renderThread();askBtn.disabled=!askIn.value.trim()}\nfunction canned(q,c,o){q=q.toLowerCase();const y=c.y2036,n=c.now,top=['flood','erosion','severe','wind'].sort((a,b)=>y[b]-y[a]);\n  const nm=k=>HAZ[k].n.toLowerCase();\n  if(o)return `${c.site} scores ${y.composite} by 2036 versus ${o.y2036.composite} for ${o.site}. The biggest gap is in ${nm(top[0])} (${y[top[0]]} vs ${o.y2036[top[0]]}).`;\n  if(q.includes('2036')||q.includes('change')||q.includes('future'))return `The composite score moves from ${n.composite} today to ${c.y2031.composite} in 2031 and ${y.composite} in 2036. ${HAZ[top[0]].n} grows the most, reaching ${y[top[0]]}.`;\n  for(const k of ['flood','erosion','wind','severe'])if(q.includes(k==='severe'?'hail':k)||q.includes(nm(k)))return `${HAZ[k].n} scores ${n[k]} today and ${y[k]} by 2036 (${binOf(y[k]).label.toLowerCase()}). ${c.risks.find(r=>r.toLowerCase().includes(k==='severe'?'hail':k==='erosion'?'retreat':k==='wind'?'gust':'inundation'))||''}`;\n  return `The composite score is driven mainly by ${nm(top[0])} (${y[top[0]]}) and ${nm(top[1])} (${y[top[1]]}) at the 2036 horizon. ${c.risks[0]?'Top specific risk: '+c.risks[0]+'.':''}`}\n\nrenderControls();renderReport();initMap();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
